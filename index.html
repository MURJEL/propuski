<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Пропуски АК3-25</title>
<style>
:root{--bg:#eef1f8;--card:#fff;--tx:#171a24;--mu:#6c7488;--ln:#e3e7f0;--ac:#4f46e5;--ac2:#8b5cf6;--r:#ef4444;--o:#f59e0b;--g:#22c55e;--sh:0 6px 22px rgba(40,50,110,.09)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1016;--card:#181b25;--tx:#eceef6;--mu:#99a1b5;--ln:#292e3b;--sh:0 6px 22px rgba(0,0,0,.45);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;cursor:pointer}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:11px;width:100%}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 30px;border-radius:0 0 26px 26px}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hero h1{margin:0;font-size:21px}.hero p{margin:3px 0 0;font-size:13px;opacity:.85}
.hero button{background:rgba(255,255,255,.2);color:#fff;border:0;padding:7px 11px;font-size:13px;border-radius:11px;margin-left:4px}
.wrap{max-width:1100px;margin:-18px auto 0;padding:0 12px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}.bar b{flex:1;text-align:center;font-size:17px}
.bar button{width:42px;padding:8px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mu)}
.dot{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.sc{overflow-x:auto;border-radius:16px;background:var(--card);box-shadow:var(--sh)}
table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
th,td{border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);padding:6px;text-align:center;min-width:32px;white-space:nowrap}
th{background:var(--bg);font-weight:600;position:sticky;top:0}
th:first-child,td:first-child{position:sticky;left:0;background:var(--card);text-align:left;min-width:150px;z-index:2}
th:first-child{background:var(--bg)}
td.c{font-weight:700;color:#fff;cursor:pointer}td.t{font-weight:700}
.cr{color:var(--r)}.co{color:var(--o)}.cg{color:var(--g)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--card);box-shadow:0 -6px 22px rgba(40,50,110,.12)}
nav button{flex:1;border:0;background:var(--bg);font-weight:600}nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
nav button.day{color:var(--r)}nav button.day.on{background:var(--r);color:#fff}
.subj{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--ln)}
.subj i{width:24px;height:24px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.subj span{flex:1}.subj a{color:var(--r);padding:4px 8px;cursor:pointer}
.row{display:flex;gap:8px;margin-top:10px}
.st{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.st:first-child{border-top:0}
.av{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.st .in{flex:1;min-width:0}.nm{font-weight:600}.badge{font-size:12px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{min-width:42px;text-align:center;padding:8px 10px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);font-weight:600;user-select:none;cursor:pointer}
.chip.r{background:var(--r);border-color:var(--r);color:#fff}.chip.o{background:var(--o);border-color:var(--o);color:#fff}.chip.g{background:var(--g);border-color:var(--g);color:#fff}
#login{max-width:380px;margin:10vh auto;padding:0 14px;text-align:center}
.big{display:flex;gap:10px;margin:14px 0}.big button{flex:1;padding:16px;font-weight:600}.big button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#msg{color:var(--r);font-size:13px;min-height:18px;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
.modal .card{width:320px;margin:0}
.mrow{display:flex;align-items:center;gap:8px;margin-top:8px}.mrow span{flex:1}.mrow input{width:84px}
</style></head><body>
<div id="login" hidden><div class="card"><div style="font-size:36px">📋</div><h2 style="margin:6px 0 2px">Пропуски АК3-25</h2><div class="badge" id="lsub"></div><div id="lbody"></div><div id="msg"></div></div></div>

<div id="app" hidden>
<div class="hero"><div class="top"><div><h1>Пропуски · АК3-25</h1><p id="who"></p></div>
<div><button id="out">Выйти</button></div></div></div>
<div class="wrap" style="padding-top:12px"><div id="v1"></div><div id="v2" hidden></div></div>
<nav><button id="t1" class="on">Таблица</button><button id="t2" class="day">ДЕНЬ</button></nav></div>

<div class="modal" id="m1"><div class="card"><b id="mt"></b>
<div class="mrow"><span class="cr">● Без причины</span><input type="number" id="mr" min="0" max="12" inputmode="numeric"></div>
<div class="mrow"><span class="co">● Объяснительная</span><input type="number" id="mo" min="0" max="12" inputmode="numeric"></div>
<div class="mrow"><span class="cg">● Уважительная</span><input type="number" id="mg" min="0" max="12" inputmode="numeric"></div>
<div class="row"><button id="mok" class="p" style="flex:1">Сохранить</button><button id="mcl">Очистить</button><button id="mx">✕</button></div></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,onValue,set}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyDubfZ_xeczjXrDbB8tGR5qNx_-YoY53nc",authDomain:"propuski-e97cd.firebaseapp.com",databaseURL:"https://propuski-e97cd-default-rtdb.europe-west1.firebasedatabase.app",projectId:"propuski-e97cd",storageBucket:"propuski-e97cd.firebasestorage.app",messagingSenderId:"630139555021",appId:"1:630139555021:web:9941758abd1cb168c1ed84"});
const auth=getAuth(app),db=getDatabase(app);
const S=["Акрамов Вильдан","Арсланов Линар","Асылбаев Ринат","Бадамшин Аскар","Байков Искандер","Байков Альберт","Вахитов Искандер","Ведерников Денис","Гарбузов Максим","Ермаков Макар","Костин Константин","Куклин Никита","Кулешов Андрей","Ларионов Владислав","Муллаянов Владислав","Олешко Роман","Перцов Иван","Садыков Богдан","Сафиуллин Ильназ","Семенов Артём","Сергиенко Дмитрий","Симонов Андрей","Фазлыеахметов Искандер","Фатхуллин Самир","Харин Данила","Хусаинов Денис","Чиглинцев Михаил","Чурагулов Марсель"];
const MN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const COL={r:"var(--r)",o:"var(--o)",g:"var(--g)"},NXT={"":"r",r:"o",o:"g",g:""};
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=new Date();let Y=now.getFullYear(),M=now.getMonth(),date=Y+"-"+pad(M+1)+"-"+pad(now.getDate());
let att={},dd={subjects:[],absent:{}},role=null,tab=1,pick="admin",unA=null,unD=null;
const mkey=()=>Y+"-"+pad(M+1);
const sum=c=>c?(c.r||0)+(c.o||0)+(c.g||0):0;
const cell=(i,d)=>(att[i]||{})[d]||null;
const canW=()=>role==="admin";
const fail=e=>alert("Не удалось сохранить: "+(e&&e.message||e));
const saveAtt=()=>set(ref(db,"att/"+mkey()),JSON.stringify(att)).catch(fail);
const saveDay=()=>set(ref(db,"days/"+date),JSON.stringify(dd)).catch(fail);
function setCell(i,d,c){if(c&&sum(c)>0){att[i]=att[i]||{};att[i][d]={r:c.r||0,o:c.o||0,g:c.g||0}}else if(att[i]){delete att[i][d];if(!Object.keys(att[i]).length)delete att[i]}}
const parse=(v,f)=>{try{return v?JSON.parse(v):f}catch(e){return f}};
function subA(){unA&&unA();unA=onValue(ref(db,"att/"+mkey()),s=>{att=parse(s.val(),{});render()},fail)}
function subD(){unD&&unD();unD=onValue(ref(db,"days/"+date),s=>{const d=parse(s.val(),{});dd={subjects:d.subjects||[],absent:d.absent||{}};render()},fail)}

function showLogin(){$("app").hidden=true;$("login").hidden=false;$("msg").textContent="";$("lsub").textContent="Выберите, кто вы · онлайн-версия";
  $("lbody").innerHTML='<div class="big"><button id="pa" class="'+(pick==="admin"?"on":"")+'">🛡 Админ</button><button id="ps" class="'+(pick==="student"?"on":"")+'">🎓 Ученик</button></div><input type="password" id="code" placeholder="Код"><div class="row"><button class="p" id="go" style="flex:1">Войти</button></div>';
  $("pa").onclick=()=>{pick="admin";showLogin()};$("ps").onclick=()=>{pick="student";showLogin()};
  const go=async()=>{const c=$("code").value.trim();if(!c)return;$("msg").textContent="Входим…";
    try{await signInWithEmailAndPassword(auth,(pick==="admin"?"admin":"student")+"@ak325.app",c)}
    catch(e){$("msg").textContent=["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(e.code)?"Неверный код или пользователь не создан в Firebase ("+e.code+")":"Ошибка: "+(e.code||e.message)}};
  $("go").onclick=go;$("code").onkeydown=e=>{if(e.key==="Enter")go()}}
function enter(r){role=r;$("login").hidden=true;$("app").hidden=false;
  $("who").textContent=r==="admin"?"Режим админа · данные онлайн":"Только просмотр · обновляется онлайн";subA();subD();render()}
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u)enter(u.email.startsWith("admin@")?"admin":"student");else{role=null;unA&&unA();unD&&unD();showLogin()}});
$("login").hidden=false;$("lbody").innerHTML='<p class="badge">Загрузка…</p>';

function viewTable(){const dim=new Date(Y,M+1,0).getDate();
  let h='<div class="card"><div class="bar"><button id="pm">‹</button><b>'+MN[M]+' '+Y+'</b><button id="nm">›</button></div><div class="leg"><span><i class="dot" style="background:var(--r)"></i>без причины</span><span><i class="dot" style="background:var(--o)"></i>объяснительная</span><span><i class="dot" style="background:var(--g)"></i>уважительная</span></div></div><div class="sc"><table><tr><th>Студент</th>';
  for(let d=1;d<=dim;d++)h+='<th>'+d+'</th>';
  h+='<th>ИТОГО</th><th class="cr">●</th><th class="co">●</th><th class="cg">●</th></tr>';
  const col=Array(dim+1).fill(0),G={r:0,o:0,g:0};
  S.forEach((n,i)=>{const T={r:0,o:0,g:0};h+='<tr><td>'+(i+1)+'. '+esc(n)+'</td>';
    for(let d=1;d<=dim;d++){const c=cell(i,d),t=sum(c);let st="";
      if(t){col[d]+=t;["r","o","g"].forEach(k=>T[k]+=c[k]||0);let p=0;
        const sg=["r","o","g"].filter(k=>c[k]).map(k=>{const a=p;p+=c[k]/t*100;return COL[k]+" "+a+"% "+p+"%"});
        st=' style="background:linear-gradient(90deg,'+(sg.length>1?sg.join(","):sg[0]+","+sg[0])+')"'}
      h+='<td class="c"'+st+' data-i="'+i+'" data-d="'+d+'">'+(t||"")+'</td>'}
    const tt=T.r+T.o+T.g;["r","o","g"].forEach(k=>G[k]+=T[k]);
    h+='<td class="t">'+(tt||"")+'</td><td class="t cr">'+(T.r||"")+'</td><td class="t co">'+(T.o||"")+'</td><td class="t cg">'+(T.g||"")+'</td></tr>'});
  h+='<tr><td><b>Всего за день</b></td>';let all=0;
  for(let d=1;d<=dim;d++){all+=col[d];h+='<td class="t">'+(col[d]||"")+'</td>'}
  h+='<td class="t">'+all+'</td><td class="t cr">'+G.r+'</td><td class="t co">'+G.o+'</td><td class="t cg">'+G.g+'</td></tr></table></div>';
  $("v1").innerHTML=h;
  $("pm").onclick=()=>{M--;if(M<0){M=11;Y--}subA()};$("nm").onclick=()=>{M++;if(M>11){M=0;Y++}subA()};
  if(canW())document.querySelectorAll("td.c").forEach(td=>td.onclick=()=>openM(+td.dataset.i,+td.dataset.d))}
let mi=0,md=0;
function openM(i,d){mi=i;md=d;const c=cell(i,d)||{};$("mt").textContent=S[i]+" · "+d+" "+MN[M].toLowerCase()+", часов";
  $("mr").value=c.r||"";$("mo").value=c.o||"";$("mg").value=c.g||"";$("m1").style.display="flex"}
const closeM=()=>{$("m1").style.display="none";saveAtt();render()};
$("mok").onclick=()=>{setCell(mi,md,{r:+$("mr").value||0,o:+$("mo").value||0,g:+$("mg").value||0});closeM()};
$("mcl").onclick=()=>{setCell(mi,md,null);const dk=Y+"-"+pad(M+1)+"-"+pad(md);
  if(dk===date){delete dd.absent[mi];saveDay()}else{set(ref(db,"days/"+dk),null).catch(fail)}closeM()};
$("mx").onclick=()=>$("m1").style.display="none";

function recalc(i){const c={r:0,o:0,g:0};Object.values(dd.absent[i]||{}).forEach(s=>c[s]+=2);setCell(i,+date.slice(8),c)}
function viewDay(){const sj=dd.subjects,w=canW();
  let h='<div class="card"><div class="bar"><input type="date" id="dt" value="'+date+'" style="flex:1"></div><b>Расписание на день</b>'+
  (sj.length?sj.map((s,k)=>'<div class="subj"><i>'+(k+1)+'</i><span>'+esc(s)+'</span>'+(w?'<a data-rm="'+k+'">✕</a>':"")+'</div>').join(""):'<p class="badge">Пока пусто</p>')+
  (w?'<div class="row"><input id="ns" placeholder="Название предмета"><button id="as" class="p">+</button></div>':"")+
  '<p class="badge" style="margin:10px 0 0">'+(w?'Нажимайте на номер пары: <span class="cr">красный</span> → <span class="co">оранжевый</span> → <span class="cg">зелёный</span> → пусто. 1 пара = 2 ч.':'Цвета: <span class="cr">без причины</span>, <span class="co">объяснительная</span>, <span class="cg">уважительная</span>.')+'</p></div><div class="card">';
  S.forEach((n,i)=>{const a=dd.absent[i]||{},t=Object.keys(a).length*2,ini=n.split(" ").map(x=>x[0]).join("");
    h+='<div class="st"><div class="av">'+ini+'</div><div class="in"><div class="nm">'+(i+1)+'. '+esc(n)+(t?' <span class="badge">· '+t+' ч</span>':"")+'</div><div class="chips">'+
    sj.map((s,k)=>'<span class="chip '+(a[k]||"")+'" data-i="'+i+'" data-k="'+k+'">'+(k+1)+'</span>').join("")+'</div></div></div>'});
  $("v2").innerHTML=h+'</div>';
  $("dt").onchange=e=>{if(e.target.value){date=e.target.value;const p=date.split("-"),nm=(+p[0]!==Y||+p[1]-1!==M);Y=+p[0];M=+p[1]-1;if(nm)subA();subD()}};
  if(!w)return;
  $("as").onclick=()=>{const v=$("ns").value.trim();if(v){sj.push(v);saveDay();render()}};
  document.querySelectorAll("[data-rm]").forEach(a=>a.onclick=()=>{const k=+a.dataset.rm;sj.splice(k,1);
    for(const i in dd.absent){const o={};for(const q in dd.absent[i]){const n=+q;if(n<k)o[n]=dd.absent[i][q];else if(n>k)o[n-1]=dd.absent[i][q]}
      if(Object.keys(o).length)dd.absent[i]=o;else delete dd.absent[i];recalc(+i)}saveDay();saveAtt();render()});
  document.querySelectorAll(".chip[data-i]").forEach(c=>c.onclick=()=>{const i=+c.dataset.i,k=+c.dataset.k;
    const a=dd.absent[i]=dd.absent[i]||{},nx=NXT[a[k]||""];if(nx)a[k]=nx;else delete a[k];
    if(!Object.keys(a).length)delete dd.absent[i];recalc(i);saveDay();saveAtt();render()})}
function render(){if(!role)return;if(tab===1)viewTable();else{const f=document.activeElement;if(f&&f.id==="ns")return;viewDay()}}
function show(n){tab=n;$("v1").hidden=n!==1;$("v2").hidden=n!==2;$("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2);render()}
$("t1").onclick=()=>show(1);$("t2").onclick=()=>show(2);
</script></body></html>
